# ==========================================
# 每周任务池
# ==========================================
# 字段和 daily.yml 完全一样，只是周期长度不同（每周一刷新，见 config.yml）。
# 每周任务一般给的经验多、量也大，用来拉开活跃玩家的差距。
#
# page       属于第几页；不写就是第 1 页（免费）。
#            第 2 页起要用点券解锁（config.yml 的 weekly.pages），
#            解锁后这一页的任务才会出现在每周任务界面里。

quests:
  w-catch:
    name: "&b本周捕捉任务"
    type: Capture
    amount: 100
    condition: "*"
    exp: 2000
    icon: PAPER
    lore:
      - "&7本周累计捕捉 100 只精灵"

  w-battle:
    name: "&c本周对战任务"
    type: BattleWin
    amount: 20
    condition: "*"
    exp: 2000
    icon: DIAMOND_SWORD
    lore:
      - "&7本周赢下 20 场对战"

  w-mine:
    name: "&7本周采集任务"
    type: BlockBreak
    amount: 1024
    condition: STONE
    exp: 1500
    icon: DIAMOND_PICKAXE
    lore:
      - "&7本周挖掉 1024 块石头"

  w-pokedex:
    name: "&6图鉴收集"
    type: Pokedex
    amount: 30
    condition: "*"
    exp: 3000
    icon: BOOK
    lore:
      - "&7累计捕捉过 30 种不同的精灵"
      - "&7由本插件自己统计，从装上那天开始算"

  # 跨插件联动：精灵打工（PokeTools）领取成功时由那边派命令推进。
  w-work:
    name: "&e打工达人"
    type: WorkFinish
    amount: 5
    condition: "*"
    exp: 1200
    icon: IRON_PICKAXE
    lore:
      - "&7本周完成 5 次精灵打工并领取"

  # ---------------- 第 2 页（需点券解锁） ----------------
  # 这一页的门槛更高、给的经验也更多，是「多买一页就多做一轮」的设计。

  w-fossil:
    name: "&5化石研究者"
    type: ReceivedFossil
    amount: 2
    condition: "*"
    exp: 2500
    icon: BONE
    page: 2
    lore:
      - "&7本周从化石机复活 2 只精灵"
      - "&8条件可填物种名，如化石翼龙写 Aerodactyl"

  w-evs:
    name: "&d努力值训练"
    type: EVsGained
    amount: 500
    condition: "*"
    exp: 2500
    icon: BLAZE_POWDER
    page: 2
    lore:
      - "&7本周累计获得 500 点努力值"

  w-enchant:
    name: "&7附魔工匠"
    type: EnchantItem
    amount: 5
    condition: "*"
    exp: 2000
    icon: ENCHANTMENT_TABLE
    page: 2
    lore:
      - "&7本周附魔 5 次装备"

  w-trade:
    name: "&a交换达人"
    type: PixelmonTrade
    amount: 5
    condition: "*"
    exp: 2000
    icon: EMERALD
    page: 2
    lore:
      - "&7本周与玩家交换 5 只精灵"
