# ============================================================================
#  界面自定义（PixelmonTXZ 战令）—— 黑底金框主题
#
#  没写的键一律用默认值；改完 /zl reload 生效。
#  写错的部分 /zl selftest 会报出来，并退回默认值，不会炸插件。
#
#  可配内容：
#    title    标题（支持 & 色码）
#    size     界面行数，9 的倍数，9~54
#    filler   铺底填充物，"材质" 或 "材质:数据值"
#    buttons  按钮：slot / material / data / name / enabled
#    decor    装饰物：slot / material / data / name / lore / glow
#             与按钮或内容区撞槽位会被跳过
#    content  （仅 daily / weekly / reward）内容槽位区，支持 "10-16,19-25" 写法
#
#  精灵图标（按钮和装饰物都支持）——用 Pixelmon 自带的精灵照片物品：
#    sprite: Pikachu     精灵英文名（任意大小写）或图鉴号，如 sprite: "25"
#    form: 0             形态编号，普通精灵写 0
#    shiny: false        true 用闪光配色
#  写了 sprite 就不再用 material 渲染；精灵名不认识 / 反射失败会退回
#  material 并在 /zl selftest 里报出来。
#
#  名字/lore 里可用的占位符：
#    %player% %level% %max_level% %exp_now% %exp_need% %total_exp%
#    %season% %days_left% %claimable% %points%
#    %daily_done% %daily_max% %weekly_done% %weekly_max%
#
#  注意：shop 的标题与尺寸在 shop.yml，这里的 shop 段只管按钮和装饰。
# ============================================================================

main:
  title: "&8&l宝可梦通行证 &8✦ 主菜单"
  size: 27
  filler: "STAINED_GLASS_PANE:15"
  buttons:
    daily:
      slot: 11
      material: BOOK
      name: "&e&l每日任务"
    weekly:
      slot: 15
      material: ENCHANTED_BOOK
      name: "&d&l每周任务"
    level:
      slot: 13
      material: BEACON
      name: "&6&l战令等级 &f&l%level%"
    season:
      slot: 20
      material: WATCH
      name: "&e&l赛季 #%season%"
    reward:
      slot: 22
      material: CHEST
      name: "&6&l等级奖励"
    shop:
      slot: 24
      material: EMERALD
      name: "&a&l兑换商店"
      enabled: true
    close:
      slot: 26
      material: BARRIER
      name: "&c✕ 关闭"
  decor:
    # 顶部横幅：黄玻璃铺满，中间星星展示个人进度
    - { slot: 0, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 1, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 2, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 3, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 5, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 6, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 7, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 8, material: STAINED_GLASS_PANE, data: 4 }
    - slot: 4
      sprite: Pikachu
      glow: true
      name: "&6&l✦ 宝可梦通行证 ✦"
      lore:
        - "&7欢迎回来，&f%player%"
        - ""
        - "&6等级 &f%level% &7/ %max_level%"
        - "&7本级进度 &f%exp_now% &7/ &f%exp_need%"
        - ""
        - "&e赛季 #%season% &7还剩 &f%days_left% &7天"
        - "&a可领奖励 &f%claimable% &7件 &8· &e点券 &f%points%"
    # 左右两根金色立柱
    - { slot: 9,  material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 17, material: STAINED_GLASS_PANE, data: 4 }
    # 底部边框（20/22/24 是按钮，26 是关闭，留给它们）
    - { slot: 18, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 19, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 21, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 23, material: STAINED_GLASS_PANE, data: 4 }
    - { slot: 25, material: STAINED_GLASS_PANE, data: 4 }

