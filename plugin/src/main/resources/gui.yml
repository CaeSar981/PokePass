# ============================================================================
#  界面自定义（PixelmonTXZ 战令）
#
#  没写的键一律用默认值，默认值就是当前界面的长相 —— 只改想改的就行。
#  改完 /zl reload 生效；写错的部分启动自检（/zl selftest）会报出来，
#  并退回默认值，不会炸插件。
#
#  每个界面可配的内容：
#    title    标题（支持 & 色码）
#    size     界面行数，必须是 9 的倍数，9~54
#    filler   铺底填充物，写法 "材质" 或 "材质:数据值"
#    buttons  每个按钮：slot 槽位 / material 材质 / data 数据值 /
#             name 名字 / enabled 设 false 隐藏按钮
#             （weekly 多一个 unlock：解锁下一页的按钮，没有可解锁页时自动隐藏）
#    decor    装饰物列表：slot / material / data / name / lore / glow，
#             纯摆设，与按钮或内容区撞槽位会被跳过
#    content  （仅 daily / weekly / reward）任务卡、奖励卡占用的槽位区，
#             支持 "10-16,19-25" 这种写法；分页按这里的格数自动重算
#
#  精灵图标（按钮和装饰物都支持，可选）——用 Pixelmon 自带的精灵照片物品：
#    sprite: Pikachu     精灵英文名（任意大小写）或图鉴号，如 sprite: "25"
#    form: 0             形态编号，普通精灵写 0
#    shiny: false        true 用闪光配色
#  写了 sprite 就不再用 material 渲染；精灵名不认识 / 反射失败会退回
#  material 并在 /zl selftest 里报出来。
#
#  名字里可用的占位符（实时取当前玩家数据）：
#    %player%        玩家名            %level%         当前等级
#    %max_level%     满级等级          %exp_now%       本级已有经验
#    %exp_need%      本级升级所需      %total_exp%     总经验
#    %season%        当前赛季号        %days_left%     距换季天数
#    %claimable%     可领取奖励数      %points%        点券余额
#    %daily_done% / %daily_max%       每日任务完成数 / 总数
#    %weekly_done% / %weekly_max%     每周任务完成数 / 总数
#
#  注意：shop 的标题与尺寸在 shop.yml 里，这里的 shop 段只管按钮和装饰。
# ============================================================================

main:
  title: "&8宝可梦通行证 | 主菜单"
  size: 27
  filler: "STAINED_GLASS_PANE:7"
  buttons:
    daily:
      slot: 11
      material: BOOK
      name: "&b&l每日任务"
    weekly:
      slot: 15
      material: ENCHANTED_BOOK
      name: "&d&l每周任务"
    level:
      slot: 13
      material: NETHER_STAR
      name: "&6&l战令等级 &f%level%"
    season:
      slot: 20
      material: WATCH
      name: "&e&l赛季 &f#%season%"
    reward:
      slot: 22
      material: CHEST
      name: "&6&l等级奖励"
    shop:
      slot: 24
      material: EMERALD
      name: "&a&l兑换商店"
      # 没配商品时这个按钮本来就不显示；enabled 只是不想用商店时的硬开关
      enabled: true
    close:
      slot: 26
      material: BARRIER
      name: "&c关闭"
  # 装饰物示例（默认注释掉）：
  # decor:
  #   - slot: 4
  #     material: SKULL_ITEM:3
  #     name: "&e&l战令"
  #     lore:
  #       - "&7欢迎 %player% 来到战令"
  #       - "&7当前赛季 #%season%，还剩 %days_left% 天"
  #     glow: true

daily:
  title: "&8宝可梦通行证 | 每日任务"
  size: 54
  content: "10-16,19-25"
  buttons:
    back:
      slot: 45
      material: ARROW
      name: "&f返回"
    prev:
      slot: 48
      material: SPECTRAL_ARROW
      name: "&a上一页"
    next:
      slot: 50
      material: SPECTRAL_ARROW
      name: "&a下一页"
    close:
      slot: 53
      material: BARRIER
      name: "&c关闭"

weekly:
  title: "&8宝可梦通行证 | 每周任务"
  size: 54
  content: "10-16,19-25"
  buttons:
    back:
      slot: 45
      material: ARROW
      name: "&f返回"
    prev:
      slot: 48
      material: SPECTRAL_ARROW
      name: "&a上一页"
    next:
      slot: 50
      material: SPECTRAL_ARROW
      name: "&a下一页"
    # 周任务分页解锁：没有可解锁的页时这个按钮不会出现
    unlock:
      slot: 49
      material: TRIPWIRE_HOOK
      name: "&a&l解锁第 %next_page% 页 &7(%page_cost% 点券)"
      enabled: true
    close:
      slot: 53
      material: BARRIER
      name: "&c关闭"

reward:
  title: "&8宝可梦通行证 | 奖励列表"
  size: 54
  content: "10-16,19-25"
  buttons:
    back:
      slot: 45
      material: ARROW
      name: "&f返回"
    prev:
      slot: 48
      material: SPECTRAL_ARROW
      name: "&a上一页"
    next:
      slot: 50
      material: SPECTRAL_ARROW
      name: "&a下一页"
    claim-all:
      slot: 49
      material: ENDER_CHEST
      name: "&a&l一键领取"
      # 有可领奖励时才出现；不想给一键领取就 enabled: false
      enabled: true
    close:
      slot: 53
      material: BARRIER
      name: "&c关闭"

# shop 的标题与尺寸在 shop.yml。这里只管返回/关闭按钮与装饰。
shop:
  buttons:
    back:
      slot: 18
      material: ARROW
      name: "&f返回"
    close:
      slot: 26
      material: BARRIER
      name: "&c关闭"
