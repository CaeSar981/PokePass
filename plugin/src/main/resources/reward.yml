# ==========================================
# 等级奖励
# ==========================================
# 每一级两条轨：
#   free     人人可领
#   premium  需要 pass.premium.permission 权限（高级轨）
#
# 奖励写法（一行一条）：
#   item:DIAMOND:5          5 个钻石；第三段可再加数据值，如 item:WOOL:1:14
#   command:give {player} diamond 1     控制台执行，{player} 换成玩家名
#   points:100              PlayerPoints 点券（没装就跳过并提示）
#   money:500               Vault 金币（没装就跳过并提示）
#
# 提示：物品名必须是 Bukkit 1.12.2 的 Material 名，全大写。
#       附魔金苹果在 1.12.2 不是独立物品，要写成 item:GOLDEN_APPLE:数量:1
#       （1.13 才拆出 ENCHANTED_GOLDEN_APPLE，写那个 1.12.2 识别不了）。
#
# 默认配满 1~50 级，与 config.yml 的 pass.max-level 对齐。曲线：
#   免费轨   每 5 级额外给一次金币，每 10 级额外给下界之星，
#            普通物品的量每 10 级上一个台阶（11~20 一档、21~30 再一档）
#   高级轨   点券 500 起步，每级 +40，满级 2100；每 5 级再附一份金苹果
# 改曲线只需要动这里的数字，不用改代码。

levels:
  1:
    free:
      - "item:DIAMOND:3"
    premium:
      - "points:100"
  2:
    free:
      - "item:GOLD_INGOT:8"
    premium:
