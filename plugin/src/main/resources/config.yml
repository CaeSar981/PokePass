# ==========================================
# PixelmonTXZ 精灵战令
# ==========================================

storage:
  # sqlite / yaml
  # sqlite 只有一个文件，几千人都够用；yaml 一人一文件，只适合单服小规模
  type: sqlite
  file: pass.db

pass:
  # 战令最高多少级
  max-level: 50
  # 升级经验曲线：从 level 升到 level+1 需要 base + (level-1) * step
  # 按默认值算：1→2 级 1000，2→3 级 1250，10→11 级 3250，满 50 级累计约 40 万
  exp:
    base: 1000
    step: 250
  # 高级轨（第二条奖励轨）
  premium:
    enabled: true
    # 有这个权限的玩家才能领高级轨奖励，用权限插件给就相当于卖战令
    permission: pokepass.premium

daily:
  # 每天几点重置每日任务（0-23）。写 5 就是凌晨 5 点才换新的一天
  reset-hour: 0
  # 每天从每日任务池里抽几个给玩家；0 = 全部放出来
  # 抽样是按「玩家 UUID + 日期」算的，同一人当天重登不会换题
  count: 3

weekly:
  # 每周几重置（MONDAY/TUESDAY/...）。按服务器每周第一天是周一计算
  reset-day: MONDAY
  # 每周任务放出几个；0 = 全部
  count: 0

reward:
  # 允许补领以前等级的奖励（等级够了但当时没领的）
  retro-claim: true

season:
  # 是否启用赛季。关掉 = 单赛季无限期，等级永远不清
  enabled: true
  # 一个赛季多少天。到期后自动换季：等级、领取记录、每日/每周进度、商店限购全部归零
  # 图鉴（抓过哪些物种）不清，那是事实记录不是本赛季成绩
  length-days: 60
  # 第 1 赛季的起始日（yyyy-MM-dd）。只影响「第几赛季 / 还剩几天」的算法，
  # 改这个值不会重置任何玩家数据；真要提前换季就把它往前挪一个赛季的长度
  start-date: "2026-10-26"

quest:
  # 快照型任务（图鉴收集数、背包满级精灵数、持有物品）多久刷新一次，单位 tick，20 = 1 秒
  check-interval-ticks: 100

# 防刷：同一玩家在极短时间内重复触发同一种「稀有事件」只记一次。
# 只作用于 捕获 / 对战胜利 / 进化 / 孵蛋 / 交易 —— 这几种一次动作耗时很长，
# 正常玩家不可能在窗口内连做两次；而挖方块、聊天这类高频操作不受影响。
anti-abuse:
  # 去重窗口（毫秒）。窗口内重复的同类型事件会被丢弃。写 0 关闭防刷
  dedupe-window-ms: 250

# 启动自检：插件启用后延迟跑一遍 /zl selftest，把结果写进控制台。
# 每次重启就知道配置有没有写坏，不用等人上号敲命令。
self-test:
  enabled: true
  # 延迟几秒再跑。Vault / PlayerPoints 的 hook 不是 enable 当下就完成的，
  # 立刻跑会把「还没 hook 上」误判成「没装」
  delay-seconds: 5

